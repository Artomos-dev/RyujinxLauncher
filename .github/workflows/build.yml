name: Build Ryujinx Launcher

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: RyujinxLauncher.exe
            upload_name: RyujinxLauncher-Windows

          - os: ubuntu-latest
            artifact_name: RyujinxLauncher
            upload_name: RyujinxLauncher-Linux

          - os: macos-latest
            artifact_name: RyujinxLauncher
            upload_name: RyujinxLauncher-MacOS

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Linux specific: SDL2 headers, Tk, and a current SDL3 built from source
    - name: Install SDL2 and SDL3 (Linux Only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev cmake build-essential python3-tk
        git clone https://github.com/libsdl-org/SDL.git --branch release-3.2.14 --depth 1
        cd SDL && cmake -B build -DSDL_SHARED=ON -DSDL_STATIC=OFF
        cmake --build build --parallel
        sudo cmake --install build

    - name: Build with build.bat (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        call .\build.bat Ryujinx
        if errorlevel 1 exit /b 1

    # build.sh chmods the produced binary itself, so GitHub preserves the
    # executable bit when it zips the artifact
    - name: Build with build.sh (Linux/macOS)
      if: runner.os != 'Windows'
      run: ./build.sh Ryujinx

    # Upload the Raw Binary
    # GitHub Actions will automatically ZIP this into 'upload_name.zip'
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.upload_name }}
        path: dist/${{ matrix.artifact_name }}
